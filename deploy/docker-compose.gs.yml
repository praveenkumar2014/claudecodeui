# Two-service topology template.
# IMPORTANT: not production-ready until NanoBot gateway command, health endpoint,
# auth contract and build context are verified against the pinned NanoBot checkout.
# This Compose file intentionally does not publish either service directly.
services:
  gs-workspace:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.gs
    depends_on:
      gs-agent-brain:
        condition: service_started
    networks:
      - public
      - agent-internal
    # Attach the public reverse proxy to "public"; configure its labels/ports
    # only after the CloudCLI server's actual listen port and auth mode are verified.

  gs-agent-brain:
    # TODO: point this build context at a pinned, reviewed NanoBot checkout.
    # NanoBot upstream is intentionally maintained as a separate codebase.
    build:
      context: ../../nanobot
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - nanobot-data:/home/nanobot/.nanobot
    networks:
      - agent-internal
    # Do not expose ports to the host. Configure authenticated service discovery
    # only after verifying the actual NanoBot gateway bind port and protocol.

networks:
  public: {}
  agent-internal:
    internal: true

volumes:
  nanobot-data: {}
